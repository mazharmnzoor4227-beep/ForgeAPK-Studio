name: Build APK - ForgeAPK Universal v11
run-name: Code2APK-${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Build job id
        required: true
        type: string

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify build job
        shell: bash
        run: |
          set -euo pipefail
          JOB="jobs/${{ inputs.build_id }}.zip"
          test -f "$JOB" || { echo "Build job not found: $JOB"; exit 1; }
          ls -lh "$JOB"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q "jobs/${{ inputs.build_id }}.zip" -d buildsrc
          test -f buildsrc/meta.json || { echo "ERROR: meta.json missing"; exit 1; }
          test -f buildsrc/www/index.html || { echo "ERROR: www/index.html missing"; exit 1; }

      - name: Read app metadata
        shell: bash
        run: |
          set -euo pipefail
          APP_NAME="$(node -p "require('./buildsrc/meta.json').appName")"
          APP_ID="$(node -p "require('./buildsrc/meta.json').appId")"
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"
          node -e "const m=require('./buildsrc/meta.json'); console.log('Permissions:',m.permissions||[])"

      - name: Create Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf capapp
          mkdir -p capapp
          cd capapp

          npm init -y
          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android \
            @capacitor/assets \
            @capacitor/camera \
            @capacitor/geolocation \
            @capacitor/filesystem \
            @capacitor/local-notifications \
            @capacitor/share \
            @capacitor/haptics \
            @capacitor/device \
            @capacitor/network \
            @capacitor/status-bar \
            @capacitor/preferences \
            @capacitor/browser \
            @capacitor/clipboard \
            @capacitor/dialog \
            @capacitor/toast \
            @capacitor/app \
            @capacitor/keyboard \
            @capacitor/motion

          cp -R ../buildsrc/www ./www
          mkdir -p assets
          [ -f ../buildsrc/assets/icon.png ] && cp ../buildsrc/assets/icon.png assets/icon.png || true
          [ -f ../buildsrc/assets/icon.jpg ] && cp ../buildsrc/assets/icon.jpg assets/icon.jpg || true
          [ -f ../buildsrc/assets/icon.jpeg ] && cp ../buildsrc/assets/icon.jpeg assets/icon.jpeg || true

          cat > capacitor.config.json <<CFG
          {
            "appId": "$APP_ID",
            "appName": "$APP_NAME",
            "webDir": "www",
            "android": {
              "allowMixedContent": true,
              "webContentsDebuggingEnabled": false
            },
            "plugins": {
              "StatusBar": {
                "overlaysWebView": false
              }
            }
          }
          CFG

          npx cap add android
          npx cap sync android

      - name: Add Android permissions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const meta=require('./buildsrc/meta.json');
          const wanted=new Set(meta.permissions||[]);
          const path='capapp/android/app/src/main/AndroidManifest.xml';
          let xml=fs.readFileSync(path,'utf8');

          const perms=['android.permission.INTERNET'];
          const legacy=[];

          // Core
          if(wanted.has('camera')) perms.push('android.permission.CAMERA');
          if(wanted.has('microphone')) perms.push('android.permission.RECORD_AUDIO');

          if(wanted.has('location')){
            perms.push('android.permission.ACCESS_FINE_LOCATION');
            perms.push('android.permission.ACCESS_COARSE_LOCATION');
          }

          if(wanted.has('notifications')){
            perms.push('android.permission.POST_NOTIFICATIONS');
          }

          if(wanted.has('haptics')){
            perms.push('android.permission.VIBRATE');
          }

          // Files / media
          if(wanted.has('files')){
            legacy.push('    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />');
            legacy.push('    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />');
          }

          if(wanted.has('photos')){
            perms.push('android.permission.READ_MEDIA_IMAGES');
            perms.push('android.permission.READ_MEDIA_VISUAL_USER_SELECTED');
            legacy.push('    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />');
          }

          if(wanted.has('audio')){
            perms.push('android.permission.READ_MEDIA_AUDIO');
            legacy.push('    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />');
          }

          if(wanted.has('video')){
            perms.push('android.permission.READ_MEDIA_VIDEO');
            perms.push('android.permission.READ_MEDIA_VISUAL_USER_SELECTED');
            legacy.push('    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />');
          }

          // Networking
          if(wanted.has('network')){
            perms.push('android.permission.ACCESS_NETWORK_STATE');
            perms.push('android.permission.ACCESS_WIFI_STATE');
          }

          // Background media / tasks
          if(wanted.has('backgroundAudio')){
            perms.push('android.permission.FOREGROUND_SERVICE');
            perms.push('android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK');
            perms.push('android.permission.WAKE_LOCK');
          }

          if(wanted.has('backgroundTasks')){
            perms.push('android.permission.FOREGROUND_SERVICE');
            perms.push('android.permission.FOREGROUND_SERVICE_DATA_SYNC');
            perms.push('android.permission.WAKE_LOCK');
          }

          // Installer
          if(wanted.has('installer')){
            perms.push('android.permission.REQUEST_INSTALL_PACKAGES');
          }

          // Bluetooth / nearby devices
          if(wanted.has('bluetooth')){
            perms.push('android.permission.BLUETOOTH_SCAN');
            perms.push('android.permission.BLUETOOTH_CONNECT');
            perms.push('android.permission.BLUETOOTH_ADVERTISE');
            legacy.push('    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />');
            legacy.push('    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />');
          }

          // NFC
          if(wanted.has('nfc')){
            perms.push('android.permission.NFC');
          }

          // Biometric authentication
          if(wanted.has('biometric')){
            perms.push('android.permission.USE_BIOMETRIC');
          }

          // Contacts
          if(wanted.has('contacts')){
            perms.push('android.permission.READ_CONTACTS');
            perms.push('android.permission.WRITE_CONTACTS');
          }

          // Calendar
          if(wanted.has('calendar')){
            perms.push('android.permission.READ_CALENDAR');
            perms.push('android.permission.WRITE_CALENDAR');
          }

          // Fitness / motion
          if(wanted.has('activityRecognition')){
            perms.push('android.permission.ACTIVITY_RECOGNITION');
          }

          const tags=[...new Set(perms)]
            .filter(p=>!xml.includes(`android:name="${p}"`))
            .map(p=>`    <uses-permission android:name="${p}" />`)
            .join('\n');

          const legacyTags=[...new Set(legacy)]
            .filter(tag=>{
              const m=tag.match(/android:name="([^"]+)"/);
              return !m || !xml.includes(`android:name="${m[1]}"`);
            })
            .join('\n');

          const allTags=[tags,legacyTags].filter(Boolean).join('\n');

          xml=xml.replace(/<application\b/, allTags+'\n\n    <application');

          xml=xml.replace(/<application\b([^>]*)>/,(m,attrs)=>{
            let a=attrs;
            if(!/android:hardwareAccelerated=/.test(a)) a+=' android:hardwareAccelerated="true"';
            if(!/android:largeHeap=/.test(a)) a+=' android:largeHeap="true"';
            return '<application'+a+'>';
          });

          fs.writeFileSync(path,xml);
          console.log('Requested capability keys:',[...wanted]);
          NODE

      - name: Add native background audio service
        shell: bash
        run: |
          set -euo pipefail

          ENABLED="$(node -e "const m=require('./buildsrc/meta.json'); console.log((m.permissions||[]).includes('backgroundAudio')?'yes':'no')")"
          if [ "$ENABLED" != "yes" ]; then
            echo "Background audio not requested."
            exit 0
          fi

          APP_DIR="capapp/android/app/src/main/java/$(echo "$APP_ID" | tr '.' '/')"
          mkdir -p "$APP_DIR"

          cat > "$APP_DIR/BackgroundAudioService.java" <<JAVA
          package $APP_ID;

          import android.app.*;
          import android.content.*;
          import android.media.*;
          import android.net.Uri;
          import android.os.*;
          import androidx.core.app.NotificationCompat;

          public class BackgroundAudioService extends Service {
            public static final String CH="forgeapk_media";
            private MediaPlayer player;

            @Override public void onCreate(){
              super.onCreate();
              if(Build.VERSION.SDK_INT>=26){
                NotificationChannel c=new NotificationChannel(CH,"Media playback",NotificationManager.IMPORTANCE_LOW);
                getSystemService(NotificationManager.class).createNotificationChannel(c);
              }
            }

            private Notification note(String title){
              Intent i=new Intent(this,MainActivity.class);
              PendingIntent pi=PendingIntent.getActivity(this,0,i,PendingIntent.FLAG_IMMUTABLE|PendingIntent.FLAG_UPDATE_CURRENT);
              return new NotificationCompat.Builder(this,CH)
                .setSmallIcon(android.R.drawable.ic_media_play)
                .setContentTitle(title==null?"Audio Playback":title)
                .setContentText("Playing in background")
                .setOngoing(true)
                .setContentIntent(pi)
                .build();
            }

            @Override public int onStartCommand(Intent intent,int flags,int startId){
              String action=intent!=null?intent.getAction():"";
              if("PLAY".equals(action)){
                String url=intent.getStringExtra("url");
                String title=intent.getStringExtra("title");
                startForeground(4881,note(title));
                try{
                  if(player!=null){player.stop();player.release();}
                  player=new MediaPlayer();
                  player.setWakeMode(getApplicationContext(),PowerManager.PARTIAL_WAKE_LOCK);
                  player.setAudioAttributes(new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build());
                  player.setDataSource(getApplicationContext(),Uri.parse(url));
                  player.setOnPreparedListener(MediaPlayer::start);
                  player.setOnCompletionListener(mp->stopSelf());
                  player.prepareAsync();
                }catch(Exception e){stopSelf();}
              }else if("PAUSE".equals(action)){
                if(player!=null && player.isPlaying()) player.pause();
              }else if("RESUME".equals(action)){
                if(player!=null && !player.isPlaying()) player.start();
              }else if("STOP".equals(action)){
                if(player!=null){try{player.stop();}catch(Exception ignored){} player.release(); player=null;}
                stopForeground(true); stopSelf();
              }
              return START_NOT_STICKY;
            }

            @Override public void onDestroy(){
              if(player!=null){try{player.stop();}catch(Exception ignored){} player.release(); player=null;}
              super.onDestroy();
            }

            @Override public IBinder onBind(Intent intent){return null;}
          }
          JAVA

          cat > "$APP_DIR/BackgroundAudioPlugin.java" <<JAVA
          package $APP_ID;

          import android.content.Intent;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.*;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name="BackgroundAudio")
          public class BackgroundAudioPlugin extends Plugin {
            @PluginMethod public void play(PluginCall call){
              String url=call.getString("url");
              String title=call.getString("title","Now Playing");
              if(url==null || url.isEmpty()){call.reject("Missing audio URL");return;}
              Intent i=new Intent(getContext(),BackgroundAudioService.class);
              i.setAction("PLAY");
              i.putExtra("url",url);
              i.putExtra("title",title);
              ContextCompat.startForegroundService(getContext(),i);
              call.resolve();
            }
            @PluginMethod public void pause(PluginCall call){send("PAUSE");call.resolve();}
            @PluginMethod public void resume(PluginCall call){send("RESUME");call.resolve();}
            @PluginMethod public void stop(PluginCall call){send("STOP");call.resolve();}
            private void send(String action){
              Intent i=new Intent(getContext(),BackgroundAudioService.class);
              i.setAction(action);
              getContext().startService(i);
            }
          }
          JAVA


          node <<'NODE'
          const fs=require('fs');
          const path='capapp/android/app/src/main/AndroidManifest.xml';
          let s=fs.readFileSync(path,'utf8');
          const service=`        <service
              android:name=".BackgroundAudioService"
              android:exported="false"
              android:foregroundServiceType="mediaPlayback" />
          `;
          if(!s.includes('.BackgroundAudioService')){
            s=s.replace('</application>',service+'    </application>');
          }
          fs.writeFileSync(path,s);
          NODE

      - name: Add native APK installer
        shell: bash
        run: |
          set -euo pipefail

          ENABLED="$(node -e "const m=require('./buildsrc/meta.json'); console.log((m.permissions||[]).includes('installer')?'yes':'no')")"
          if [ "$ENABLED" != "yes" ]; then
            echo "APK installer not requested."
            exit 0
          fi

          APP_DIR="capapp/android/app/src/main/java/$(echo "$APP_ID" | tr '.' '/')"
          mkdir -p "$APP_DIR"

          cat > "$APP_DIR/ApkInstallerPlugin.java" <<JAVA
          package $APP_ID;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.*;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.io.*;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          @CapacitorPlugin(name="ApkInstaller")
          public class ApkInstallerPlugin extends Plugin {

            private final ExecutorService executor = Executors.newSingleThreadExecutor();

            @PluginMethod
            public void downloadAndInstall(PluginCall call) {
              String url = call.getString("url");
              String fileName = call.getString("fileName", "forgeapk-build.apk");

              if (url == null || url.isEmpty()) {
                call.reject("Missing APK URL");
                return;
              }

              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O &&
                  !getContext().getPackageManager().canRequestPackageInstalls()) {
                Intent settingsIntent = new Intent(
                  Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                  Uri.parse("package:" + getContext().getPackageName())
                );
                settingsIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                getContext().startActivity(settingsIntent);

                JSObject result = new JSObject();
                result.put("needsPermission", true);
                result.put("message", "Enable Allow from this source, then tap Download & Install again.");
                call.resolve(result);
                return;
              }

              File dir = getContext().getExternalFilesDir("apk");
              if (dir == null) {
                call.reject("App storage unavailable");
                return;
              }
              if (!dir.exists()) dir.mkdirs();

              File apk = new File(dir, fileName.replaceAll("[^a-zA-Z0-9._-]", "-"));

              executor.execute(() -> {
                HttpURLConnection connection = null;
                try {
                  URL current = new URL(url);
                  int redirects = 0;

                  while (true) {
                    connection = (HttpURLConnection) current.openConnection();
                    connection.setInstanceFollowRedirects(false);
                    connection.setConnectTimeout(20000);
                    connection.setReadTimeout(120000);
                    connection.setRequestProperty("User-Agent", "ForgeAPK-Studio");
                    int code = connection.getResponseCode();

                    if (code >= 300 && code < 400 && redirects < 8) {
                      String location = connection.getHeaderField("Location");
                      connection.disconnect();
                      if (location == null) throw new IOException("Redirect without location");
                      current = new URL(current, location);
                      redirects++;
                      continue;
                    }

                    if (code < 200 || code >= 300) {
                      throw new IOException("Download failed: HTTP " + code);
                    }
                    break;
                  }

                  try (InputStream in = new BufferedInputStream(connection.getInputStream());
                       OutputStream out = new BufferedOutputStream(new FileOutputStream(apk))) {
                    byte[] buffer = new byte[8192];
                    int n;
                    while ((n = in.read(buffer)) != -1) out.write(buffer, 0, n);
                  } finally {
                    if (connection != null) connection.disconnect();
                  }

                  getActivity().runOnUiThread(() -> {
                    try {
                      Uri uri = FileProvider.getUriForFile(
                        getContext(),
                        getContext().getPackageName() + ".fileprovider",
                        apk
                      );

                      Intent install = new Intent(Intent.ACTION_VIEW);
                      install.setDataAndType(uri, "application/vnd.android.package-archive");
                      install.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      install.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(install);

                      JSObject result = new JSObject();
                      result.put("started", true);
                      result.put("path", apk.getAbsolutePath());
                      call.resolve(result);
                    } catch (Exception e) {
                      call.reject("Could not open Android installer: " + e.getMessage(), e);
                    }
                  });

                } catch (Exception e) {
                  if (connection != null) connection.disconnect();
                  call.reject("APK download failed: " + e.getMessage(), e);
                }
              });
            }
          }
          JAVA


      - name: Add native media library
        shell: bash
        run: |
          set -euo pipefail

          ENABLED="$(node -e "const m=require('./buildsrc/meta.json'); const p=m.permissions||[]; console.log((p.includes('photos')||p.includes('audio')||p.includes('video'))?'yes':'no')")"
          if [ "$ENABLED" != "yes" ]; then
            echo "Native media library not requested."
            exit 0
          fi

          APP_DIR="capapp/android/app/src/main/java/$(echo "$APP_ID" | tr '.' '/')"
          mkdir -p "$APP_DIR"

          cat > "$APP_DIR/MediaLibraryPlugin.java" <<JAVA
          package $APP_ID;

          import android.Manifest;
          import android.content.ContentResolver;
          import android.content.ContentUris;
          import android.database.Cursor;
          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.util.Size;

          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;

          @CapacitorPlugin(
            name="MediaLibrary",
            permissions={
              @Permission(alias="images", strings={Manifest.permission.READ_MEDIA_IMAGES}),
              @Permission(alias="video", strings={Manifest.permission.READ_MEDIA_VIDEO}),
              @Permission(alias="audio", strings={Manifest.permission.READ_MEDIA_AUDIO}),
              @Permission(alias="legacy", strings={Manifest.permission.READ_EXTERNAL_STORAGE})
            }
          )
          public class MediaLibraryPlugin extends Plugin {

            @PluginMethod
            public void requestAndScan(PluginCall call){
              if(Build.VERSION.SDK_INT >= 33){
                requestPermissionForAliases(
                  new String[]{"images","video","audio"},
                  call,
                  "permissionCallback"
                );
              }else{
                requestPermissionForAlias("legacy",call,"permissionCallback");
              }
            }

            @PermissionCallback
            private void permissionCallback(PluginCall call){
              scan(call);
            }

            @PluginMethod
            public void scan(PluginCall call){
              try{
                JSArray items=new JSArray();
                ContentResolver cr=getContext().getContentResolver();

                query(cr,MediaStore.Video.Media.EXTERNAL_CONTENT_URI,"video",items);
                query(cr,MediaStore.Audio.Media.EXTERNAL_CONTENT_URI,"audio",items);
                query(cr,MediaStore.Images.Media.EXTERNAL_CONTENT_URI,"image",items);

                JSObject out=new JSObject();
                out.put("items",items);
                call.resolve(out);
              }catch(Exception e){
                call.reject("Media scan failed: "+e.getMessage(),e);
              }
            }

            private void query(ContentResolver cr, Uri base, String type, JSArray items){
              String[] projection;
              if("image".equals(type)){
                projection=new String[]{
                  MediaStore.MediaColumns._ID,
                  MediaStore.MediaColumns.DISPLAY_NAME,
                  MediaStore.MediaColumns.SIZE,
                  MediaStore.MediaColumns.DATE_ADDED
                };
              }else{
                projection=new String[]{
                  MediaStore.MediaColumns._ID,
                  MediaStore.MediaColumns.DISPLAY_NAME,
                  MediaStore.MediaColumns.SIZE,
                  MediaStore.MediaColumns.DATE_ADDED,
                  MediaStore.MediaColumns.DURATION
                };
              }

              try(Cursor c=cr.query(
                base,
                projection,
                null,
                null,
                MediaStore.MediaColumns.DATE_ADDED+" DESC"
              )){
                if(c==null) return;

                int idI=c.getColumnIndexOrThrow(MediaStore.MediaColumns._ID);
                int nameI=c.getColumnIndexOrThrow(MediaStore.MediaColumns.DISPLAY_NAME);
                int sizeI=c.getColumnIndexOrThrow(MediaStore.MediaColumns.SIZE);
                int dateI=c.getColumnIndexOrThrow(MediaStore.MediaColumns.DATE_ADDED);
                int durI="image".equals(type) ? -1 : c.getColumnIndex(MediaStore.MediaColumns.DURATION);

                int count=0;
                while(c.moveToNext() && count<250){
                  long id=c.getLong(idI);
                  Uri uri=ContentUris.withAppendedId(base,id);

                  JSObject o=new JSObject();
                  o.put("type",type);
                  o.put("name",c.getString(nameI));
                  o.put("size",c.getLong(sizeI));
                  o.put("dateAdded",c.getLong(dateI));
                  o.put("duration",durI>=0 ? c.getLong(durI) : 0);
                  o.put("uri",uri.toString());
                  items.put(o);
                  count++;
                }
              }catch(Exception ignored){}
            }

            @PluginMethod
            public void thumbnail(PluginCall call){
              String uriText=call.getString("uri");
              if(uriText==null){call.reject("Missing uri");return;}

              try{
                if(Build.VERSION.SDK_INT < 29){
                  JSObject out=new JSObject();
                  out.put("dataUrl","");
                  call.resolve(out);
                  return;
                }

                Bitmap bmp=getContext().getContentResolver().loadThumbnail(
                  Uri.parse(uriText),
                  new Size(320,320),
                  null
                );

                ByteArrayOutputStream bos=new ByteArrayOutputStream();
                bmp.compress(Bitmap.CompressFormat.JPEG,72,bos);
                String b64=Base64.encodeToString(bos.toByteArray(),Base64.NO_WRAP);

                JSObject out=new JSObject();
                out.put("dataUrl","data:image/jpeg;base64,"+b64);
                call.resolve(out);
              }catch(Exception e){
                JSObject out=new JSObject();
                out.put("dataUrl","");
                call.resolve(out);
              }
            }

            @PluginMethod
            public void materialize(PluginCall call){
              String uriText=call.getString("uri");
              String name=call.getString("name","media.bin");
              if(uriText==null){call.reject("Missing uri");return;}

              try{
                File dir=new File(getContext().getCacheDir(),"forge_media");
                if(!dir.exists()) dir.mkdirs();

                String safe=name.replaceAll("[^a-zA-Z0-9._-]","_");
                File outFile=new File(dir,System.currentTimeMillis()+"_"+safe);

                try(InputStream in=getContext().getContentResolver().openInputStream(Uri.parse(uriText));
                    FileOutputStream out=new FileOutputStream(outFile)){
                  if(in==null) throw new Exception("Cannot open media");
                  byte[] buf=new byte[65536];
                  int n;
                  while((n=in.read(buf))>0) out.write(buf,0,n);
                }

                JSObject out=new JSObject();
                out.put("fileUri",Uri.fromFile(outFile).toString());
                call.resolve(out);
              }catch(Exception e){
                call.reject("Could not prepare media: "+e.getMessage(),e);
              }
            }
          }
          JAVA

      - name: Configure native plugin registration
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="capapp/android/app/src/main/java/$(echo "$APP_ID" | tr '.' '/')"
          mkdir -p "$APP_DIR"

          BG="$(node -e "const m=require('./buildsrc/meta.json'); console.log((m.permissions||[]).includes('backgroundAudio')?'yes':'no')")"
          INSTALLER="$(node -e "const m=require('./buildsrc/meta.json'); console.log((m.permissions||[]).includes('installer')?'yes':'no')")"
          MEDIA="$(node -e "const m=require('./buildsrc/meta.json'); const p=m.permissions||[]; console.log((p.includes('photos')||p.includes('audio')||p.includes('video'))?'yes':'no')")"

          {
            echo "package $APP_ID;"
            echo
            echo "import android.os.Bundle;"
            echo "import com.getcapacitor.BridgeActivity;"
            echo
            echo "public class MainActivity extends BridgeActivity {"
            echo "  @Override"
            echo "  public void onCreate(Bundle savedInstanceState) {"
            if [ "$BG" = "yes" ]; then
              echo "    registerPlugin(BackgroundAudioPlugin.class);"
            fi
            if [ "$INSTALLER" = "yes" ]; then
              echo "    registerPlugin(ApkInstallerPlugin.class);"
            fi
            if [ "$MEDIA" = "yes" ]; then
              echo "    registerPlugin(MediaLibraryPlugin.class);"
            fi
            echo "    super.onCreate(savedInstanceState);"
            echo "  }"
            echo "}"
          } > "$APP_DIR/MainActivity.java"

      - name: Configure stable personal signing
        shell: bash
        run: |
          set -euo pipefail

          echo '' | base64 -d > capapp/android/app/forgeapk-dev.jks

          node <<'NODE'
          const fs = require('fs');
          const path = 'capapp/android/app/build.gradle';
          let s = fs.readFileSync(path, 'utf8');

          const versionCode = Math.floor(Date.now()/1000);
          const versionName = '1.0.' + versionCode;

          s = s.replace(/versionCode\s+\d+/, 'versionCode ' + versionCode);
          s = s.replace(/versionName\s+["'][^"']+["']/, 'versionName "' + versionName + '"');

          if (!s.includes('signingConfigs {')) {
            s = s.replace(
              /\n\s*buildTypes\s*\{/,
              `

              signingConfigs {
                  forgeapk {
                      storeFile file("forgeapk-dev.jks")
                      storePassword "ForgeAPKDev2026!"
                      keyAlias "forgeapk"
                      keyPassword "ForgeAPKDev2026!"
                  }
              }

              buildTypes {`
            );
          }

          s = s.replace(
            /buildTypes\s*\{/,
            `buildTypes {
                  debug {
                      signingConfig signingConfigs.forgeapk
                  }`
          );

          s = s.replace(
            /release\s*\{/,
            `release {
                      signingConfig signingConfigs.forgeapk`
          );

          fs.writeFileSync(path, s);
          console.log('Stable signing configured with versionCode', versionCode);
          NODE

      - name: Generate Android icon
        shell: bash
        run: |
          set -euo pipefail
          cd capapp
          if [ -f assets/icon.png ] || [ -f assets/icon.jpg ] || [ -f assets/icon.jpeg ]; then
            npx @capacitor/assets generate --android || true
          else
            echo "No custom app icon uploaded."
          fi

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          cd capapp/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate generated APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          APK="$(find capapp/android/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          test -n "$APK" || { echo "ERROR: APK file not found"; exit 1; }
          cp "$APK" "output/app-${{ inputs.build_id }}.apk"
          ls -lh output

      - name: Publish only latest APK for direct download
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          mkdir -p downloads
          find downloads -maxdepth 1 -type f -name '*.apk' -delete || true

          cp "output/app-${{ inputs.build_id }}.apk" "downloads/app-${{ inputs.build_id }}.apk"
          git add -A downloads

          if [ -f "jobs/${{ inputs.build_id }}.zip" ]; then
            git rm -f "jobs/${{ inputs.build_id }}.zip"
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Publish latest APK ${{ inputs.build_id }}"
            git push origin main
          fi

      - name: Upload APK artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.build_id }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 3
